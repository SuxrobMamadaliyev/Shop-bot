<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SAHIFA: Do'kon ===== -->
  <section id="page-shop" class="page">
    <header class="header">
      <h1>🛍 Do'konimiz</h1>
    </header>
    <main id="productList" class="product-list"></main>
  </section>

  <!-- ===== SAHIFA: Buyurtmalarim ===== -->
  <section id="page-orders" class="page hidden">
    <header class="header"><h1>📦 Buyurtmalarim</h1></header>
    <div id="ordersList" class="orders-list"></div>
  </section>

  <!-- ===== SAHIFA: Profil ===== -->
  <section id="page-profile" class="page hidden">
    <header class="header"><h1>👤 Profil</h1></header>
    <div id="profileInfo" class="profile-info"></div>
  </section>

  <!-- ===== Savat tugmasi (faqat Do'kon sahifasida, mahsulot bo'lganda chiqadi) ===== -->
  <div id="cartBar" class="cart-bar hidden">
    <span id="cartInfo">0 ta mahsulot — 0 so'm</span>
    <button id="cartBtn">Savat 🛒</button>
  </div>

  <div id="cartModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🛒 Savat</h2>
        <button id="closeCart" class="icon-btn" type="button" aria-label="Yopish">✕</button>
      </div>

      <div id="cartItems" class="cart-items"></div>

      <div id="cartSummary" class="cart-summary hidden">
        <div class="summary-row"><span>Mahsulotlar</span><span id="summaryCount">0 ta</span></div>
        <div class="summary-row total"><span>Jami to'lov</span><span id="summaryTotal">0 so'm</span></div>
      </div>

      <form id="checkoutForm" class="checkout-form">
        <label class="field">
          <span class="field-label">👤 Ism familiya</span>
          <input id="fullName" placeholder="Masalan: Aliyev Vali" autocomplete="name" />
        </label>
        <label class="field">
          <span class="field-label">📞 Telefon raqam</span>
          <input id="phone" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel" />
        </label>
        <label class="field">
          <span class="field-label">📍 Yetkazish manzili</span>
          <input id="address" placeholder="Shahar, ko'cha, uy" autocomplete="street-address" />
        </label>
        <button type="submit" id="checkoutBtn">
          <span class="btn-label">To'lovga o'tish</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- ===== Pastki navbar ===== -->
  <nav class="navbar">
    <button class="nav-item active" data-page="shop">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Do'kon</span>
    </button>
    <button class="nav-item" data-page="cart">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">Savat</span>
      <span id="navCartBadge" class="nav-badge hidden">0</span>
    </button>
    <button class="nav-item" data-page="orders">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Buyurtmalar</span>
    </button>
    <button class="nav-item" data-page="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Profil</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
